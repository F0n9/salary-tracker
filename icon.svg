<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

  <g filter="url(#subtleShadow)">
    <circle cx="236" cy="236" r="132" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    
    <line x1="236" y1="236" x2="236" y2="148" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <line x1="236" y1="236" x2="296" y2="236" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <circle cx="236" cy="236" r="14" fill="#ffffff"/>

    <circle cx="340" cy="340" r="92" fill="url(#coinGrad)" stroke="#ffffff" stroke-width="14"/>
    <circle cx="340" cy="340" r="76" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
    <text x="340" y="372" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="94" 
          font-weight="900" 
          fill="#78350f" 
          text-anchor="middle">₫</text>
  </g>
</svg>
