<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Clock Outer Ring -->
  <circle cx="256" cy="256" r="148" fill="#131d2e" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="720 180" filter="url(#glow)"/>

  <!-- Hour markers -->
  <circle cx="256" cy="136" r="6" fill="#94a3b8"/>
  <circle cx="376" cy="256" r="6" fill="#94a3b8"/>
  <circle cx="256" cy="376" r="6" fill="#94a3b8"/>
  <circle cx="136" cy="256" r="6" fill="#94a3b8"/>

  <!-- Clock Hands -->
  <!-- Hour Hand -->
  <line x1="256" y1="256" x2="256" y2="180" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <!-- Minute Hand pointing to 20m -->
  <line x1="256" y1="256" x2="330" y2="295" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#10b981" stroke="#f8fafc" stroke-width="4"/>

  <!-- Currency / Salary Badge -->
  <g transform="translate(310, 310)">
    <circle cx="48" cy="48" r="46" fill="url(#gold)" stroke="#0f172a" stroke-width="6" filter="url(#glow)"/>
    <text x="48" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="middle">đ</text>
  </g>
</svg>
