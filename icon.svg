<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Basic Morphic Base Surface: Rich Sapphire / Royal Blue -->
    <linearGradient id="morphicBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Top-Left Specular Light Reflection -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter for Squircle -->
    <filter id="morphicDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e3a8a" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle Emboss Shadow for Icon -->
    <filter id="iconDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow Background -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#morphicBase)" filter="url(#morphicDropShadow)"/>

  <!-- Main Morphic Body Plate -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#morphicBase)"/>

  <!-- Specular 3D Bevel Border -->
  <rect x="37" y="37" width="438" height="438" rx="107" fill="none" stroke="url(#specularRim)" stroke-width="2.5"/>

  <!-- Inner Soft Bevel Inset -->
  <rect x="52" y="52" width="408" height="408" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Minimal Basic Morphic Wallet Symbol (Centered at 256, 256) -->
  <g transform="translate(136, 136) scale(10)" filter="url(#iconDepth)">
    <!-- Wallet Main Shell -->
    <path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4" 
          fill="#ffffff" 
          fill-opacity="0.22"
          stroke="#ffffff" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Wallet Flap / Compartment -->
    <path d="M16 11h5a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-5a2 2 0 0 1-2-2v0a2 2 0 0 1 2-2Z" 
          fill="#ffffff" 
          stroke="#ffffff" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Fastener Clasp Dot -->
    <circle cx="18.5" cy="13" r="0.85" fill="#1d4ed8"/>
  </g>
</svg>
