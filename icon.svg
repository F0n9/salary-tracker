<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Clean Graphite Canvas) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Subtle Golden Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Coin Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Back Secondary Coin (Depth) -->
  <g transform="translate(40, -30) opacity(0.28)">
    <circle cx="256" cy="256" r="130" fill="url(#coinGrad)"/>
    <circle cx="256" cy="256" r="118" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  </g>

  <!-- Front Primary Coin -->
  <g transform="translate(-10, 15)">
    <!-- Outer Glow / Edge -->
    <circle cx="256" cy="256" r="140" fill="url(#coinGrad)" stroke="url(#rimGrad)" stroke-width="8"/>
    
    <!-- Inner Inset Groove -->
    <circle cx="256" cy="256" r="122" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="6"/>
    <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

    <!-- Vietnamese Dong Currency Symbol '₫' -->
    <text x="256" y="296" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Outfit', sans-serif" 
          font-size="130" 
          font-weight="900" 
          fill="#18181b" 
          text-anchor="middle"
          letter-spacing="-0.04em">₫</text>
  </g>
</svg>
