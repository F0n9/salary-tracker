<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate & Midnight Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Shift Arc Gradient: Electric Sky Blue to Emerald Mint -->
    <linearGradient id="shiftArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Cash / Coin Element Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Metallic Platinum Needle -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="softDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle (iOS / Modern Android App Icon standard) -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="116" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2.5"/>
  <circle cx="256" cy="240" r="210" fill="url(#centerGlow)"/>

  <!-- Core Icon Group with Shadow -->
  <g filter="url(#softDepth)">
    
    <!-- Outer Shift Dial Ring (Background Track) -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="28"/>

    <!-- Dynamic Work Shift Arc: Sweeping 270 degrees (Productivity & Hours) -->
    <!-- Arc starting at 135deg (bottom-left) to 45deg (top-right) -->
    <path d="M 151.3 360.7 
             A 148 148 0 1 1 360.7 151.3" 
          fill="none" 
          stroke="url(#shiftArcGrad)" 
          stroke-width="28" 
          stroke-linecap="round"
          filter="url(#glowEffect)"/>

    <!-- Subtle Dial Hour Markers (12, 3, 6, 9 o'clock) -->
    <circle cx="256" cy="108" r="5" fill="#38bdf8" opacity="0.9"/>
    <circle cx="404" cy="256" r="5" fill="#10b981" opacity="0.9"/>
    <circle cx="256" cy="404" r="5" fill="rgba(255,255,255,0.25)"/>
    <circle cx="108" cy="256" r="5" fill="rgba(255,255,255,0.25)"/>

    <!-- Clock Center Hub: Modern Double Ring -->
    <circle cx="256" cy="256" r="28" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
    <circle cx="256" cy="256" r="14" fill="url(#needleGrad)"/>

    <!-- Clock Hour Hand (Pointing left-down towards 8:00, Shift Start) -->
    <line x1="256" y1="256" x2="190" y2="295" stroke="url(#needleGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Clock Minute / Growth Hand (Pointing up-right towards 2:00, Peak Earnings & Shift End) -->
    <line x1="256" y1="256" x2="334" y2="178" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

    <!-- The "Salary / Earnings Token" (Bottom Right Intersection) -->
    <!-- Floating Emerald Cash Node with Stylized Currency Mark -->
    <g transform="translate(320, 320)">
      <!-- Outer Pulsing Glow -->
      <circle cx="44" cy="44" r="52" fill="#10b981" opacity="0.18"/>
      <!-- Solid Badge -->
      <circle cx="44" cy="44" r="42" fill="url(#coinGrad)" stroke="#ffffff" stroke-width="5"/>
      <circle cx="44" cy="44" r="34" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      
      <!-- Modern Currency / Growth Symbol: Minimalist 'S' (Salary / Shift) -->
      <path d="M 52 30 
               C 52 26, 36 26, 36 34 
               C 36 42, 52 44, 52 54 
               C 52 62, 34 62, 34 57" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      <line x1="44" y1="23" x2="44" y2="28" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="59" x2="44" y2="64" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>

  </g>
</svg>
